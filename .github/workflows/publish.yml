name: publish

# Publishes to PyPI when a release is created on GitHub. Requires
# a `PYPI_API_TOKEN` repo secret with PyPI upload scope on the
# `mcp-guard` project. To publish: bump the version in
# pyproject.toml, create a GitHub release pointing at that tag,
# this workflow runs.
#
# To enable: set the PYPI_API_TOKEN secret. Until then, this
# workflow runs but the publish step gracefully skips (the
# guarded if-statement on the secret).

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        if: ${{ env.PYPI_API_TOKEN != '' }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          python -m twine upload \
            --verbose \
            --username __token__ \
            --password "$PYPI_API_TOKEN" \
            dist/*
      - name: Notice if no token
        if: ${{ env.PYPI_API_TOKEN == '' }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          echo "::warning::PYPI_API_TOKEN secret not set; skipping upload."
          echo "::warning::Built artifacts are in dist/ as workflow run artifacts."
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
