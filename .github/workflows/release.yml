name: Release

# Tag-driven PyInstaller build of the `mcp-guard` CLI binary across 5 targets.
# Capframe's `capframe install guard` downloads these archives by exact filename
# (`mcp-guard-<tag>-<target>.<ext>`) and verifies them against the `.sha256` sidecar.
#
# Note: aarch64-pc-windows-msvc is not built — GitHub-hosted Windows ARM runners
# aren't generally available yet. Capframe install on Windows-ARM will fail for
# Guard until that runner ships.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.5.3)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install package + pyinstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: bundle binary
        shell: bash
        run: |
          set -eu
          # Tiny entry shim so PyInstaller's analysis pins the cli:main entry.
          echo "from mcp_guard.cli import main; main()" > _entry.py
          pyinstaller --onefile --clean --name mcp-guard _entry.py
          ls -lah dist/

      - name: smoke-test bundled binary
        shell: bash
        run: |
          set -eu
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            ./dist/mcp-guard.exe --help || true
            ./dist/mcp-guard.exe --version || true
          else
            ./dist/mcp-guard --help || true
            ./dist/mcp-guard --version || true
          fi

      - name: package archive + sha256
        shell: bash
        run: |
          set -eu
          ver="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          name="mcp-guard-${ver}-${{ matrix.target }}"
          mkdir -p out "stage/$name"

          if [[ "${{ matrix.target }}" == *windows* ]]; then
            ext=".exe"
          else
            ext=""
          fi

          cp "dist/mcp-guard${ext}" "stage/$name/"
          cp README.md LICENSE "stage/$name/" 2>/dev/null || true

          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd stage && 7z a -tzip "../out/${name}.zip" "$name" >/dev/null)
          else
            tar -czf "out/${name}.tar.gz" -C stage "$name"
          fi

          archive_name="${name}.${{ matrix.archive }}"
          (cd out && \
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$archive_name" > "${archive_name}.sha256"
            else
              shasum -a 256 "$archive_name" > "${archive_name}.sha256"
            fi)

          ls -lah out/

      - uses: actions/upload-artifact@v4
        with:
          name: mcp-guard-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: list artifacts
        run: ls -lah out/

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag }}
          name: ${{ github.ref_name || github.event.inputs.tag }}
          files: out/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
