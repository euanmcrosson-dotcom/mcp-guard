[build-system]
# setuptools 77+ is required for PEP 639 SPDX license strings —
# earlier versions silently fall back to the deprecated TOML-table
# license form which PyPI's strict upload validator now rejects.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# PyPI distribution name. The GitHub repo + Python import name stay
# `mcp-guard` / `mcp_guard`; only the PyPI-installable name differs.
# Reason: an unrelated dormant project at https://pypi.org/project/mcpguard/
# (different author, 0 stars, single commit 2026-02-27, never updated)
# squats the adjacent namespace, and PyPI's PEP-541-style similarity
# check refuses `mcp-guard` as too close to `mcpguard`. `mcp-guardrails`
# is arguably a better name anyway — "guardrails" is the established
# term in the AI-safety vocabulary (Nemo Guardrails, Guardrails AI,
# Llama Guard, etc.). Users `pip install mcp-guardrails` and write
# `from mcp_guard import ...` — Pillow/PIL pattern.
name = "mcp-guardrails"
version = "0.5.3"
description = "Drop-in deterministic policy layer for MCP-using AI agents"
readme = "README.md"
requires-python = ">=3.11"
# PEP 639: SPDX expression as a string. The deprecated `{ text = "MIT" }`
# table form is rejected by PyPI's strict metadata validator on
# upload, even though setuptools only warns about it locally.
license = "MIT"
authors = [
    { name = "Euan Crosson", email = "euanmcrosson@gmail.com" },
]
keywords = [
    "ai-security",
    "prompt-injection",
    "llm-security",
    "mcp",
    "model-context-protocol",
    "policy",
    "agent-security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    # License classifier removed in v0.5.1 — PEP 639 says the license
    # field above is authoritative; carrying both is now a PyPI upload
    # error rather than just a deprecation warning.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = []  # zero runtime deps — pure stdlib

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Optional integration extras. Each adds the framework you're plugging into.
anthropic-mcp = [
    "mcp>=1.0",
]
langchain = [
    "langchain-core>=0.3",
]
llamaindex = [
    "llama-index-core>=0.11",
]
crewai = [
    "crewai>=0.70",
]
llm = [
    "anthropic>=0.40",
]
# Everything (for development / testing the full surface).
all = [
    "mcp>=1.0",
    "langchain-core>=0.3",
    "llama-index-core>=0.11",
    "crewai>=0.70",
    "anthropic>=0.40",
]

[project.urls]
Homepage = "https://github.com/euanmcrosson-dotcom/mcp-guard"
Repository = "https://github.com/euanmcrosson-dotcom/mcp-guard"
Issues = "https://github.com/euanmcrosson-dotcom/mcp-guard/issues"
"Companion (offensive)" = "https://github.com/euanmcrosson-dotcom/purple-scaffold"

[project.scripts]
mcp-guard = "mcp_guard.cli:main"

[tool.setuptools]
packages = ["mcp_guard", "mcp_guard.integrations"]

[tool.setuptools.exclude-package-data]
"*" = ["case_studies/*", "tests/*"]
